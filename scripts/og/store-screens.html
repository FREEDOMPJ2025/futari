<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <title>Futari · store screenshot render</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" />
  <style>
    /* App Store / Play story screenshots — illustration first, UI second.
     * Laid out at 430×932 CSS px (iPhone 6.7" in points) and rendered at
     * deviceScaleFactor 3 → 1290×2796. Brand register (PRODUCT.md Surface
     * Tiers): committed cream ground, cocoa ink, one ember per frame.
     * No exclamation marks, no 管理／追蹤／監控 (CLAUDE.md copy rules). */
    :root {
      --bg-committed: #EFDDC4;
      --ink: #3A2419;
      --ink-2: #6B4C3B;
      --ember: #E08856;
      --surface: #FFFFFF;
    }
    html, body { margin: 0; padding: 0; }
    body {
      /* --w/--h are set from the query string: 430×932 for iPhone 6.7",
       * 1032×1376 for the 13" iPad. Everything else scales via --k. */
      width: var(--w, 430px);
      height: var(--h, 932px);
      background: var(--bg-committed);
      color: var(--ink);
      font-family: 'Noto Sans TC', -apple-system, system-ui, sans-serif;
      position: relative;
      overflow: hidden;
    }
    /* The composition is authored once at 430×932 and scaled to fit the target
     * store size, centred on the cream ground. The iPad is a different aspect
     * ratio, so it gets side margins of ground rather than a stretched layout. */
    #root {
      position: absolute;
      width: 430px;
      height: 932px;
      transform-origin: top left;
      overflow: hidden;
    }
    /* data-lang is the app locale (zh-TW | zh-CN | en | ja). zh-TW and en use
     * Noto Sans TC (its Latin is what the zh-TW frames have always shown);
     * zh-CN and ja need their own CJK face so simplified hanzi and kana get
     * the regional glyph shapes. The SC stylesheet is added by the script
     * below only for zh-CN, so the zh-TW render requests exactly what it
     * always did. */
    body[data-lang="ja"] { font-family: 'Noto Sans JP', 'Noto Sans TC', sans-serif; }
    body[data-lang="zh-CN"] { font-family: 'Noto Sans SC', 'Noto Sans TC', sans-serif; }

    /* The scene. Full-bleed, fading into the ground so the copy reads as
     * part of the same room rather than a caption under a photo. */
    .scene {
      position: absolute;
      inset: 0 0 auto 0;
      height: 520px;
      background-size: cover;
      background-position: center;
      -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
              mask-image: linear-gradient(to bottom, #000 72%, transparent 100%);
    }
    .scene.hero {
      /* illustration-hero.png carries its own white rounded frame; scale past
       * it so no white edge shows at the top of the store frame. */
      height: 700px;
      background-size: auto 112%;
      background-position: 46% 50%;
    }

    /* Placeholder until the illustration exists — deliberately not a
     * drawing, so nobody mistakes the draft for the final art. */
    .scene.todo {
      background:
        radial-gradient(circle at 50% 38%, rgba(224,136,86,0.38) 0%, rgba(224,136,86,0.10) 34%, rgba(224,136,86,0) 62%),
        linear-gradient(180deg, #5B4636 0%, #8A6B52 55%, var(--bg-committed) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .todo-card {
      margin: 0 36px 60px;
      padding: 16px 18px;
      border: 1.5px dashed rgba(251,237,224,0.7);
      border-radius: 16px;
      color: #FBEDE0;
      font-size: 14px;
      line-height: 1.6;
    }
    .todo-card b { display: block; font-size: 12px; letter-spacing: 2px; opacity: 0.8; margin-bottom: 4px; }

    .copy {
      position: absolute;
      left: 32px;
      right: 32px;
      top: 500px;
    }
    .hero-copy { top: 680px; }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 22px;
      font-weight: 500;
    }
    .brand svg { width: 22px; height: 22px; }
    .headline {
      margin: 0;
      font-size: 40px;
      line-height: 1.22;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .headline .lit { color: var(--ember); }
    .sub {
      margin: 14px 0 0;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink-2);
    }

    /* The UI, cropped to the one moment the frame is about. A warm lamp
     * bloom sits behind it instead of a drop shadow on the card itself. */
    .shot-wrap {
      position: absolute;
      left: 32px;
      right: 32px;
      bottom: 40px;
    }
    .shot-wrap::before {
      content: '';
      position: absolute;
      inset: -40px -20px;
      background: radial-gradient(ellipse at 50% 50%, rgba(255,248,238,0.9) 0%, rgba(255,248,238,0) 70%);
    }
    .shot {
      position: relative;
      border-radius: 24px;
      background-repeat: no-repeat;
      background-color: #FBEDE0;
      outline: 1px solid rgba(58,36,25,0.08);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const params = new URLSearchParams(location.search)
    // App locale codes (lib/i18n/locales-meta.ts). render-store-screens.mjs
    // passes ?locale=; the old ?lang=zh still means zh-TW.
    const LOCALES = ['zh-TW', 'zh-CN', 'en', 'ja']
    const rawLocale = params.get('locale') || params.get('lang') || 'zh-TW'
    const locale = rawLocale === 'zh' ? 'zh-TW' : rawLocale
    if (!LOCALES.includes(locale)) throw new Error(`unknown locale ${rawLocale}`)
    document.documentElement.lang = locale
    const W = Number(params.get('w') || 430)
    const H = Number(params.get('h') || 932)
    document.documentElement.style.setProperty('--w', W + 'px')
    document.documentElement.style.setProperty('--h', H + 'px')
    const S = Math.min(W / 430, H / 932)
    const rootEl = document.getElementById('root')
    rootEl.style.transform = `scale(${S})`
    rootEl.style.left = `${(W - 430 * S) / 2}px`
    rootEl.style.top = `${(H - 932 * S) / 2}px`
    const frameId = params.get('frame') || '1'
    document.body.dataset.lang = locale

    // Device screenshots of the same locale: zh-TW keeps the original flat
    // folder, the others live in screenshots/<locale>/ (capture-screens.mjs
    // --locale). The image is a CSS background, so a missing file renders as
    // an empty card without any error; render-store-screens.mjs checks the
    // files listed in __STORE_META__ exist before it screenshots anything.
    const SHOTS = '../../docs/store-assets/screenshots/' + (locale === 'zh-TW' ? '' : locale + '/')
    const SHOT_W = 1290 // source screenshots are iPhone 6.7" 1290×2796

    /* crop: [x0, y0, x1, y1] in source pixels. Crops stay clear of the bottom
     * nav — originally because the 2026-08 sources carried a dev-overlay "N"
     * badge there (the 2026-09-20 re-capture no longer does), and still
     * because a cropped nav bar reads as a broken screenshot. */
    /* Order = store order. Frame 1 is the only one a search-result card is
     * sure to show, so it states what the app does (split + settle); the
     * brand hero moved to 2 (#1759). */
    const frames = {
      1: { shot: '01-dashboard-ios-6.7.png', crop: [0, 500, 1290, 1010],
           scene: '../../docs/store-assets/illustrations/story-2.png', pos: '50% 60%', brief: '巷口那家晚餐。兩人並肩坐在麵店吧台，一人拿手機結帳，另一人看著笑。頭頂一顆燈泡的暖光，窗外是雨後的巷子。' },
      2: { scene: '../../public/illustration-hero.png', hero: true },
      3: { shot: '01-dashboard-ios-6.7.png', crop: [50, 1290, 1240, 2030],
           scene: '../../docs/store-assets/illustrations/story-3.png', pos: '50% 55%', brief: '晚上的廚房。一人把超市袋子的東西收進冰箱，另一人靠在流理台邊用手機記一筆。桌上放著收據和一杯熱茶。' },
      4: { shot: '04-assets-ios-6.7.png', crop: [50, 1440, 1240, 2230],
           scene: '../../docs/store-assets/illustrations/story-4.png', pos: '40% 18%', brief: '傍晚的客廳。窗台上一盆小仙子（多肉），柴犬麻糬趴在沙發腳邊，兩人的腳擱在同一張小凳上。斜斜的夕陽光。' },
      5: { shot: '03-trip-ios-6.7.png', crop: [50, 520, 1240, 1130],
           scene: '../../docs/store-assets/illustrations/story-5.png', pos: '50% 60%', brief: '旅行的回程。兩人拖著行李走出車站，行李箱上掛著御守，一人手上提著伴手禮。黃昏，路燈剛亮。' },
    }

    // en / zh-CN / ja are captured from today's app (#1904), whose dashboard has
    // a "monthly review / trips" row and whose assets page lists 家裡的 before
    // 一起照顧的, so the zh-TW crops (2026-09-20 captures) miss the balance card
    // and the plant. Same heights as zh-TW, so the layout doesn't move.
    if (locale !== 'zh-TW') {
      frames[1].crop = [0, 400, 1290, 910]   // balance card, whole
      frames[4].crop = [50, 1650, 1240, 2440] // 一起照顧的: child, pet, plant
    }

    // zh-TW is the master (CLAUDE.md i18n rule). Its text is fixed: the
    // numbers and names in it are the ones in the zh-TW screenshots.
    //
    // zh-CN / en / ja: Aria's copy (#1904 comment 6605692812), still a
    // proposal until Ray approves it. `proposal: true` renders normally and
    // render-store-screens.mjs prints one line saying so. `pending: true` (a
    // placeholder, refused unless --allow-pending-copy, written as -DRAFT) is
    // kept for future copy that has no text yet; no locale uses it today.
    //
    // {name} placeholders are demo-ledger facts, filled from
    // window.__STORE_VARS__, which render-store-screens.mjs builds from
    // scripts/og/demo-data/<locale>.json (written by seed-demo-ledgers.ts) and
    // {days} from <locale>.capture.json (written by capture-screens.mjs from
    // the plant card it captured). A placeholder without a value is rendered
    // as ⟦name⟧ and listed in __STORE_META__.missingVars; the render script
    // refuses to write anything while that list is not empty.
    // ` / ` in Aria's table is the line break; the second line is the lit span.
    const ZH_TW = {
      1: { head: ['誰先付的，', '<span class="lit">不用再算。</span>'], sub: '每一筆都分好了。想結清的時候，點一下就好。' },
      2: { head: ['兩個人，', '<span class="lit">一本帳。</span>'], sub: '一起記，回頭看會很暖。' },
      3: { head: ['一起記下的，', '<span class="lit">都是日子。</span>'], sub: '晚餐、看牙、營養液，兩個人的日常都在這裡。' },
      4: { head: ['小仙子陪了我們', '<span class="lit">285 天。</span>'], sub: '孩子、毛孩、植物，家裡的每一個都記得。' },
      5: { head: ['大阪七天，', '<span class="lit">回家就結清。</span>'], sub: '日圓、台幣照常記，旅行的帳自己分開算。' },
    }
    const copy = {
      'zh-TW': { frames: ZH_TW },
      'zh-CN': {
        proposal: true,
        frames: {
          1: { head: ['谁先付的，', '<span class="lit">不用再算。</span>'], sub: '每一笔都分好了。想结清的时候，点一下就好。' },
          2: { head: ['两个人，', '<span class="lit">一本账。</span>'], sub: '一起记，回头看会很暖。' },
          3: { head: ['一起记下的，', '<span class="lit">都是日子。</span>'], sub: '{item1}、{item2}、{item3}，两个人的日常都在这里。' },
          4: { head: ['{plantName}陪了我们', '<span class="lit">{days} 天。</span>'], sub: '孩子、毛孩子、植物，家里的每一个都记得。' },
          5: { head: ['{tripPlace}七天，', '<span class="lit">回家就结清。</span>'], sub: '{localCurrency}、{homeCurrency}照常记，旅行的账自己分开算。' },
        },
      },
      en: {
        proposal: true,
        frames: {
          1: { head: ['Who paid first?', '<span class="lit">No more math.</span>'], sub: 'Every entry is already split. When you want to settle up, it takes one tap.' },
          2: { head: ['Two people,', '<span class="lit">one ledger.</span>'], sub: 'Note it down together. Looking back feels warm.' },
          3: { head: ['Each entry,', '<span class="lit">a day we lived.</span>'], sub: '{item1}, {item2}, {item3}: life for two, all in one place.' },
          4: { head: ['{plantName} and us:', '<span class="lit">{days} days together.</span>'], sub: 'Kids, pets, plants: everyone at home.' },
          5: { head: ['{tripPlace}, 7 days.', '<span class="lit">Settled at home.</span>'], sub: 'Record in {localCurrency} and {homeCurrency}. The trip keeps its own books.' },
        },
      },
      ja: {
        proposal: true,
        frames: {
          1: { head: ['立て替えも、', '<span class="lit">もう計算しない。</span>'], sub: '1 件ずつ、もう分けてあります。精算したいときは、タップひとつで。' },
          2: { head: ['ふたりで、', '<span class="lit">ひとつの家計簿。</span>'], sub: '一緒に記録して、振り返るとあたたかい。' },
          3: { head: ['記録したのは、', '<span class="lit">ふたりの毎日。</span>'], sub: '{item1}、{item2}、{item3}。ふたりの日常が、ここにそろっています。' },
          4: { head: ['{plantName}と一緒に', '<span class="lit">{days} 日。</span>'], sub: '子ども、ペット、植物も、ひとつの家計簿に。' },
          5: { head: ['{tripPlace} 7 日間、', '<span class="lit">帰ったら精算。</span>'], sub: '旅行の家計簿は別に計算して、帰ったらまとめて精算します。' },
        },
      },
    }

    // Fill {name} from the demo-data values. Values are text, so escape them
    // before they meet innerHTML.
    const VARS = window.__STORE_VARS__ || {}
    const escapeHtml = (v) => String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
    const PLACEHOLDER = /\{([a-zA-Z0-9]+)\}/g
    const placeholdersOf = (fr) => [...(fr.head.join('') + fr.sub).matchAll(PLACEHOLDER)].map((m) => m[1])
    const fill = (text) => text.replace(PLACEHOLDER, (_, name) =>
      VARS[name] === undefined || VARS[name] === null || VARS[name] === '' ? `⟦${name}⟧` : escapeHtml(VARS[name]))

    // Read by render-store-screens.mjs before it takes any screenshot.
    const neededVars = [...new Set(Object.values(copy[locale].frames).flatMap(placeholdersOf))]
    window.__STORE_META__ = {
      locale,
      pending: !!copy[locale].pending,
      proposal: !!copy[locale].proposal,
      neededVars,
      missingVars: neededVars.filter((n) => VARS[n] === undefined || VARS[n] === null || VARS[n] === ''),
      shotsByFrame: Object.fromEntries(
        Object.entries(frames).filter(([, fr]) => fr.shot).map(([id, fr]) => [id, SHOTS + fr.shot]),
      ),
    }

    const f = frames[frameId]
    const raw = copy[locale].frames[frameId]
    const t = { head: raw.head.map(fill), sub: fill(raw.sub) }
    const root = document.getElementById('root')

    const scene = document.createElement('div')
    if (f.todo) {
      scene.className = 'scene todo'
      scene.innerHTML = `<div class="todo-card"><b>插畫 ${frameId}（待繪）</b>${f.todo}</div>`
    } else {
      scene.className = 'scene' + (f.hero ? ' hero' : '')
      scene.style.backgroundImage = `url(${f.scene})`
      if (f.pos) scene.style.backgroundPosition = f.pos
    }
    root.appendChild(scene)

    const c = document.createElement('div')
    c.className = 'copy' + (f.hero ? ' hero-copy' : '')
    c.innerHTML =
      (f.hero ? `<div class="brand"><svg viewBox="0 0 24 24" fill="none"><path d="M8 6a4 4 0 0 1 8 0" stroke="#3A2419" stroke-width="2.2" stroke-linecap="round"/><rect x="5" y="6" width="14" height="15" rx="2" stroke="#3A2419" stroke-width="2.2"/><path d="M12 10c1.6 2 2.4 3.4 2.4 4.6a2.4 2.4 0 0 1-4.8 0c0-1.2.8-2.6 2.4-4.6z" fill="#E08856"/></svg>Futari</div>` : '') +
      `<h1 class="headline">${t.head.join('<br>')}</h1><p class="sub">${t.sub}</p>`
    root.appendChild(c)

    if (f.shot) {
      const [x0, y0, x1, y1] = f.crop
      const w = 430 - 64
      const k = w / (x1 - x0)
      const wrap = document.createElement('div')
      wrap.className = 'shot-wrap'
      const shot = document.createElement('div')
      shot.className = 'shot'
      shot.style.width = w + 'px'
      shot.style.height = Math.round((y1 - y0) * k) + 'px'
      shot.style.backgroundImage = `url(${SHOTS}${f.shot})`
      shot.style.backgroundSize = `${SHOT_W * k}px auto`
      shot.style.backgroundPosition = `${-x0 * k}px ${-y0 * k}px`
      wrap.appendChild(shot)
      root.appendChild(wrap)
    }

    // zh-CN needs Noto Sans SC; wait for its stylesheet before fonts.ready,
    // otherwise fonts.ready can resolve before the face is even declared and
    // the headline silently falls back to Noto Sans TC's traditional glyphs.
    const extraFont = locale === 'zh-CN'
      ? new Promise((resolve) => {
          const link = document.createElement('link')
          link.rel = 'stylesheet'
          link.href = 'https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap'
          link.onload = link.onerror = resolve
          document.head.appendChild(link)
        })
      : Promise.resolve()
    extraFont.then(() => document.fonts.ready).then(() => { window.__OG_READY__ = true })
  </script>
</body>
</html>
